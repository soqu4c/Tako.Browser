# Builds the Windows installer and publishes it as a GitHub release.
# Runs for a pushed v* tag, for a commit whose message contains [release],
# or by hand from the Actions tab. The tag is v<version from package.json>;
# versions with a dash (0.3.0-beta.1) become pre-releases.
name: Release

on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Xray makes vless/vmess/trojan/ss links work without any setup
      - name: Bundle the Xray core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray -Force
          Copy-Item xray/xray.exe bin/
          if (Test-Path xray/LICENSE) { Copy-Item xray/LICENSE bin/xray-LICENSE.txt }

      - name: Build the installer
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Tako.Browser ${{ steps.v.outputs.tag }}
          prerelease: ${{ steps.v.outputs.pre }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
