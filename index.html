<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<div id="bg"><div id="bg-img"></div><video id="bg-video" muted loop playsinline hidden></video><div id="bg-blobs"><i></i><i></i><i></i></div><div id="bg-grain"></div><div id="bg-dim"></div></div>

<header id="titlebar">
  <img class="logo" src="assets/logo.png" alt="">
  <span class="app-name" id="app-name">Tako<span class="app-suffix">.browser</span></span>
  <span class="page-title" id="page-title"></span>
  <div class="slot" id="slot-top"></div>
  <div class="drag-fill"></div>
</header>

<div id="app">
  <div class="slot slot-v" id="slot-left"></div>

  <aside id="notes" hidden>
    <div class="notes-head">
      <b>Заметки</b>
      <div class="seg tiny" id="notes-filter">
        <button data-f="all" class="on">Все</button>
        <button data-f="site">Этот сайт</button>
      </div>
      <span class="flex"></span>
      <button class="icon sm" id="notes-add" title="Новая заметка"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="icon sm" id="notes-close" title="Закрыть"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div id="notes-list-view">
      <label class="search-field"><svg class="i"><use href="#i-search"/></svg><input id="notes-search" placeholder="Поиск по заметкам"></label>
      <div id="notes-list"></div>
    </div>
    <div id="note-editor" hidden>
      <div class="ne-top">
        <button class="btn ghost small" id="ne-back"><svg class="i"><use href="#i-back"/></svg>Все заметки</button>
        <span class="flex"></span>
        <div class="ne-colors" id="ne-colors"></div>
      </div>
      <input id="ne-title" class="ne-title" placeholder="Без названия" spellcheck="false">
      <textarea id="ne-text" placeholder="Пишите что угодно… Заметка сохраняется сама."></textarea>
      <div class="ne-site" id="ne-site"></div>
      <div class="ne-actions">
        <button class="btn small" id="ne-link" title="Привязать к открытой странице"><svg class="i"><use href="#i-link"/></svg><span>К этой странице</span></button>
        <button class="btn small" id="ne-quote" title="Вставить выделенный на странице текст"><svg class="i"><use href="#i-quote"/></svg>Выделенное</button>
        <span class="flex"></span>
        <button class="icon sm danger" id="ne-delete" title="Удалить"><svg class="i"><use href="#i-trash"/></svg></button>
      </div>
      <div class="ne-meta" id="ne-meta"></div>
    </div>
  </aside>

  <div id="center">
    <main id="browser">
      <div id="toolbar">
        <button class="icon sm" id="nav-back" title="Назад (Alt+←)"><svg class="i"><use href="#i-back"/></svg></button>
        <button class="icon sm" id="nav-fwd" title="Вперёд (Alt+→)"><svg class="i"><use href="#i-fwd"/></svg></button>
        <button class="icon sm" id="nav-reload" title="Обновить (F5)"><svg class="i"><use href="#i-reload"/></svg></button>
        <button class="icon sm" id="nav-home" title="Стартовая"><svg class="i"><use href="#i-home"/></svg></button>
        <form id="omnibox" autocomplete="off">
          <svg class="i" id="omni-icon"><use href="#i-search"/></svg>
          <input id="address" spellcheck="false" placeholder="Поиск или адрес сайта">
          <span id="zoom-chip" hidden></span>
          <button type="button" class="omni-btn" id="vpn-site-chip" hidden title="Этот сайт открывается через VPN"><svg class="i"><use href="#i-shield-on"/></svg></button>
          <button type="button" class="omni-btn" id="omni-block" hidden title="Блокировка рекламы"><svg class="i"><use href="#i-block"/></svg><b id="omni-block-n"></b></button>
          <button type="button" class="omni-btn" id="omni-reader" hidden title="Режим чтения"><svg class="i"><use href="#i-book"/></svg></button>
          <button type="button" class="omni-btn" id="omni-dial" title="Добавить на стартовую"><svg class="i"><use href="#i-pin"/></svg></button>
          <button type="button" class="omni-btn" id="omni-star" title="В закладки (Ctrl+D)"><svg class="i"><use href="#i-star"/></svg></button>
          <div id="suggest" hidden></div>
        </form>
        <button class="icon sm" id="btn-vpn" title="VPN"><svg class="i"><use href="#i-shield"/></svg></button>
        <button class="icon sm" id="btn-notes" title="Заметки (Ctrl+N)"><svg class="i"><use href="#i-note"/></svg><b class="badge" id="notes-badge" hidden></b></button>
        <button class="icon sm" id="btn-downloads" title="Загрузки (Ctrl+J)" hidden><svg class="i"><use href="#i-download"/></svg><i class="dl-ring" id="dl-ring"></i></button>
        <button class="icon sm" id="btn-settings" title="Настройки (Ctrl+,)"><svg class="i"><use href="#i-gear"/></svg></button>
        <button class="icon sm" id="btn-menu" title="Меню"><svg class="i"><use href="#i-menu"/></svg></button>
        <div class="progress-line" id="progress"></div>
      </div>

      <div id="bmbar" hidden></div>

      <div id="findbar" hidden>
        <input id="find-input" placeholder="Найти на странице">
        <span id="find-count"></span>
        <button class="icon sm" id="find-prev"><svg class="i"><use href="#i-up"/></svg></button>
        <button class="icon sm" id="find-next"><svg class="i"><use href="#i-down"/></svg></button>
        <button class="icon sm" id="find-close"><svg class="i"><use href="#i-x"/></svg></button>
      </div>

      <div id="content">
        <div id="split-divider" hidden><button class="icon sm" id="split-close" title="Закрыть разделение"><svg class="i"><use href="#i-x"/></svg></button></div>
        <section id="reader" hidden>
          <div class="reader-bar">
            <svg class="i"><use href="#i-book"/></svg><b id="reader-site"></b>
            <span class="flex"></span>
            <button class="btn small ghost" id="reader-smaller" title="Мельче">A−</button>
            <button class="btn small ghost" id="reader-bigger" title="Крупнее">A+</button>
            <div class="seg tiny" id="reader-theme"><button data-v="app">Как браузер</button><button data-v="sepia">Сепия</button><button data-v="light">Светлая</button></div>
            <button class="icon sm" id="reader-close" title="Закрыть (Esc)"><svg class="i"><use href="#i-x"/></svg></button>
          </div>
          <iframe id="reader-frame" sandbox="allow-popups allow-popups-to-escape-sandbox" title="Режим чтения"></iframe>
        </section>
        <section id="start">
          <div class="start-glow"></div>
          <div class="start-inner">
            <div class="private-banner"><svg class="i"><use href="#i-mask"/></svg><div><b>Приватная вкладка</b><small>История, cookies и данные сайтов не сохранятся — всё удалится, когда вы закроете последнюю приватную вкладку.</small></div></div>
            <div class="start-meta"><img class="start-logo" src="assets/logo.png" alt=""><span id="clock"></span></div>
            <h1 id="greeting">Куда отправимся?</h1>
            <svg class="squiggle" viewBox="0 0 240 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 9c14-5 22 4 36 1s19-7 33-4 18 6 32 3 20-6 34-3 17 5 31 2 21-5 35-2 22 4 33 1"/></svg>
            <form id="start-search" autocomplete="off">
              <svg class="i"><use href="#i-search"/></svg>
              <input id="start-input" spellcheck="false" placeholder="Искать в Google или ввести адрес">
              <button class="btn accent" type="submit" id="start-go">Найти</button>
            </form>
            <div class="dial-head"><span>Мои сайты</span><small>правая кнопка по плитке — изменить</small></div>
            <div id="dial"></div>
          </div>
          <button class="btn ghost small start-customize" id="start-customize"></button>
        </section>
        <div id="page-error" hidden>
          <img src="assets/logo.png" alt="">
          <h2>Страница не открылась</h2>
          <p id="page-error-text"></p>
          <div class="row"><button class="btn accent" id="page-error-retry">Попробовать снова</button><button class="btn" id="page-error-vpn">Открыть через VPN</button></div>
        </div>
      </div>
    </main>
    <div class="slot" id="slot-bottom"></div>
  </div>

  <div class="slot slot-v" id="slot-right"></div>
</div>

<nav id="tabstrip">
  <button id="ws-btn" title="Пространства"><i class="ws-dot"></i><span id="ws-name"></span></button>
  <div id="tabs"></div>
  <button class="icon sm" id="tab-new" title="Новая вкладка (Ctrl+T)"><svg class="i"><use href="#i-plus"/></svg></button>
</nav>

<div id="popover" hidden></div>
<div id="tab-preview" hidden><img alt=""><b></b><small></small></div>
<div id="menu" hidden></div>
<div id="toasts"></div>

<dialog id="settings-dlg" class="wide">
  <div class="set-layout">
    <nav id="set-tabs"></nav>
    <div class="set-main">
      <div id="set-panel"></div>
      <div class="actions"><button class="btn accent close-dlg">Готово</button></div>
    </div>
  </div>
</dialog>

<dialog id="dial-dlg">
  <h2 id="dial-dlg-title">Новая плитка</h2>
  <form method="dialog" id="dial-form">
    <label class="field"><span class="label">Название</span><input class="text-input" id="dial-name" placeholder="Например, YouTube"></label>
    <label class="field"><span class="label">Адрес</span><input class="text-input" id="dial-url" placeholder="youtube.com" required></label>
    <div class="actions"><button type="button" class="btn ghost close-dlg">Отмена</button><button class="btn accent" value="ok">Сохранить</button></div>
  </form>
</dialog>

<dialog id="ask-dlg">
  <h2 id="ask-title"></h2>
  <form method="dialog" id="ask-form">
    <div id="ask-fields"></div>
    <div class="actions"><button type="button" class="btn ghost close-dlg">Отмена</button><button class="btn accent" value="ok" id="ask-ok">Готово</button></div>
  </form>
</dialog>

<dialog id="history-dlg" class="list-dlg">
  <div class="dlg-head"><h2>История</h2><span class="flex"></span><button class="icon sm close-dlg" title="Закрыть"><svg class="i"><use href="#i-x"/></svg></button></div>
  <label class="search-field"><svg class="i"><use href="#i-search"/></svg><input id="history-search" placeholder="Поиск по истории"></label>
  <div class="list-body" id="history-list"></div>
  <div class="actions"><button class="btn small" id="history-clear-hour">Удалить за последний час</button><button class="btn small" id="history-clear-day">За сегодня</button><span class="spacer flex"></span><button class="btn small danger" id="history-clear-all">Очистить всю историю</button></div>
</dialog>

<dialog id="bm-dlg" class="list-dlg">
  <div class="dlg-head"><h2>Закладки</h2><span class="flex"></span><button class="icon sm close-dlg" title="Закрыть"><svg class="i"><use href="#i-x"/></svg></button></div>
  <label class="search-field"><svg class="i"><use href="#i-search"/></svg><input id="bm-search" placeholder="Поиск по закладкам"></label>
  <div class="list-body" id="bm-list"></div>
  <div class="actions"><span class="import-label">Импорт:</span><button class="btn small" data-import="chrome">Chrome</button><button class="btn small" data-import="yandex">Яндекс</button><button class="btn small" data-import="edge">Edge</button><button class="btn small" data-import="brave">Brave</button><button class="btn small" data-import="file">Из файла…</button></div>
</dialog>

<script src="renderer.js"></script>
<script src="features.js"></script>
</body>
</html>
